<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>内网通话</title>
<style>
  body{font-family:-apple-system,sans-serif;margin:14px;max-width:600px}
  button{font-size:16px;padding:8px 14px;margin:4px 4px 4px 0}
  textarea{width:100%;height:70px;font-size:12px;box-sizing:border-box}
  video{width:48%;background:#000;border-radius:8px}
  .box{display:none;margin-top:10px}
  #st{color:#07c;margin-left:6px}
</style>

<h3>内网通话 <span id="st"></span></h3>
<button id="b1">我先发起</button>
<button id="b2">我来接听</button>

<!-- 发起方：1.复制连接码发给对方  2.粘贴对方回复码 -->
<div id="caller" class="box">
  <p>① 把下面的连接码发给对方：</p>
  <textarea id="offer" readonly></textarea>
  <button onclick="copy('offer')">复制</button>
  <p>② 粘贴对方发回的回复码：</p>
  <textarea id="answerIn"></textarea>
  <button id="connect">连接</button>
</div>

<!-- 接听方：1.粘贴对方连接码  2.复制回复码发回 -->
<div id="callee" class="box">
  <p>① 粘贴对方发来的连接码：</p>
  <textarea id="offerIn"></textarea>
  <button id="reply">生成回复码</button>
  <p>② 把下面的回复码发回给对方：</p>
  <textarea id="answer" readonly></textarea>
  <button onclick="copy('answer')">复制</button>
</div>

<p>
  <video id="local" autoplay muted playsinline></video>
  <video id="remote" autoplay playsinline></video>
</p>

<script>
const $ = id => document.getElementById(id);
let pc;

const enc = d => btoa(JSON.stringify(d));
const dec = s => JSON.parse(atob(s.trim()));

async function init() {
  const stream = await navigator.mediaDevices.getUserMedia({audio: true, video: true});
  $('local').srcObject = stream;
  pc = new RTCPeerConnection();                 // 内网直连，不需要 STUN
  stream.getTracks().forEach(t => pc.addTrack(t, stream));
  pc.ontrack = e => $('remote').srcObject = e.streams[0];
  pc.onconnectionstatechange = () => $('st').textContent = pc.connectionState;
}

// 等候选地址收集完，让连接码里包含全部地址
function gathered() {
  return new Promise(res => {
    if (pc.iceGatheringState === 'complete') return res();
    pc.onicegatheringstatechange = () => pc.iceGatheringState === 'complete' && res();
    setTimeout(res, 3000);
  });
}

function copy(id) {
  const t = $(id); t.select();
  (navigator.clipboard ? navigator.clipboard.writeText(t.value) : Promise.reject())
    .catch(() => document.execCommand('copy'));
}

$('b1').onclick = async () => {                  // 发起方
  $('caller').style.display = 'block';
  await init();
  await pc.setLocalDescription(await pc.createOffer());
  await gathered();
  $('offer').value = enc(pc.localDescription);
};

$('connect').onclick = async () => {
  await pc.setRemoteDescription(dec($('answerIn').value));
};

$('b2').onclick = async () => {                  // 接听方
  $('callee').style.display = 'block';
  await init();
};

$('reply').onclick = async () => {
  await pc.setRemoteDescription(dec($('offerIn').value));
  await pc.setLocalDescription(await pc.createAnswer());
  await gathered();
  $('answer').value = enc(pc.localDescription);
};
</script>
