<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>内网网页电话</title>
<style>
  *{box-sizing:border-box}
  body{font-family:system-ui,sans-serif;max-width:520px;margin:0 auto;padding:14px;background:#f4f6f8;color:#222}
  h2{margin:4px 0 10px}
  .card{background:#fff;border-radius:12px;padding:12px;margin-bottom:12px;box-shadow:0 1px 3px #0002}
  input,textarea{width:100%;padding:9px;border:1px solid #ccc;border-radius:8px;font-size:15px}
  textarea{height:84px;font:12px monospace}
  button{padding:10px 14px;border:0;border-radius:8px;background:#2f6fed;color:#fff;font-size:15px;margin:4px 4px 0 0}
  button.red{background:#e0413a} button.green{background:#1f9d55} button.gray{background:#777}
  button:disabled{opacity:.4}
  .row{display:flex;gap:8px} .row>*{flex:1}
  #status{font-size:18px;font-weight:bold;margin:4px 0}
  .tabs button{background:#ddd;color:#333} .tabs button.on{background:#2f6fed;color:#fff}
  .pad button{width:30%;background:#eee;color:#222;font-size:18px}
  small{color:#666}
  #log{height:110px;overflow:auto;background:#111;color:#7CFC00;font:12px monospace;padding:6px;border-radius:8px;white-space:pre-wrap}
</style>
</head>
<body>
<h2>📞 内网网页电话</h2>

<div class="card">
  <div class="row">
    <div><small>我的分机号</small><input id="ext" value="" placeholder="如 1001" inputmode="numeric"></div>
    <div><small>我的名字</small><input id="name" placeholder="如 前台"></div>
  </div>
  <div id="status">空闲</div>
  <button id="btnOnline">上线</button>
</div>

<div class="card tabs">
  <button id="tabA" class="on">① 同一台电脑 / 同浏览器（输分机号）</button>
  <button id="tabB">② 不同设备（复制呼叫码）</button>
</div>

<!-- 模式一：分机号拨号 -->
<div class="card" id="modeA">
  <small>在本浏览器的另一个标签页打开本文件，设置不同分机号并上线，就可以互相拨号。</small>
  <input id="dial" placeholder="输入对方分机号" inputmode="numeric" style="margin-top:6px">
  <div class="pad" id="pad"></div>
  <button id="btnCall" class="green" disabled>呼叫</button>
</div>

<!-- 模式二：跨设备手动信令 -->
<div class="card" id="modeB" style="display:none">
  <small>两台设备在同一局域网（同一 WiFi/交换机）即可，无需服务器。</small>
  <p><b>主叫方：</b></p>
  <button id="btnGenOffer">1. 生成呼叫码</button>
  <textarea id="offerOut" readonly placeholder="把这段发给对方（微信/当面复制）"></textarea>
  <textarea id="answerIn" placeholder="3. 把对方回的应答码粘贴到这里"></textarea>
  <button id="btnApplyAnswer">4. 连接</button>
  <hr>
  <p><b>被叫方：</b></p>
  <textarea id="offerIn" placeholder="2. 粘贴对方的呼叫码"></textarea>
  <button id="btnGenAnswer">生成应答码</button>
  <textarea id="answerOut" readonly placeholder="把这段发回给主叫方"></textarea>
</div>

<div class="card">
  <button id="btnAnswer" class="green" disabled>接听</button>
  <button id="btnHangup" class="red" disabled>挂断</button>
  <button id="btnMute" class="gray" disabled>静音</button>
  <audio id="remote" autoplay></audio>
</div>

<div id="log"></div>

<script>
const $ = id => document.getElementById(id);
const log = m => { $('log').textContent += new Date().toLocaleTimeString()+'  '+m+'\n'; $('log').scrollTop=1e9; };
const setStatus = s => $('status').textContent = s;

// 局域网内直连，不使用任何外部 STUN/TURN
const RTC_CFG = { iceServers: [] };

let localStream=null, pc=null, bc=null, online=false;
let callId=null, peerExt=null, pendingOffer=null, muted=false, ringTimer=null, actx=null;

// ---------- 拨号盘 ----------
'123456789*0#'.split('').forEach(k=>{
  const b=document.createElement('button'); b.textContent=k;
  b.onclick=()=>{ $('dial').value+=k; }; $('pad').appendChild(b);
});

// ---------- 铃声 ----------
function ring(on){
  clearInterval(ringTimer);
  if(!on) return;
  actx = actx || new (window.AudioContext||window.webkitAudioContext)();
  const beep=()=>{
    const o=actx.createOscillator(), g=actx.createGain();
    o.frequency.value=440; g.gain.value=.15;
    o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime+.6);
  };
  beep(); ringTimer=setInterval(beep,2000);
}

// ---------- 麦克风 ----------
async function getMic(){
  if(localStream) return localStream;
  try{
    localStream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});
  }catch(e){
    alert('无法使用麦克风：'+e.message+'\n如果是直接双击打开的文件被拦截，请改用浏览器地址栏输入 file 路径，或用 localhost 打开。');
    throw e;
  }
  return localStream;
}

// ---------- 创建连接 ----------
async function newPC(){
  closePC();
  const stream = await getMic();
  pc = new RTCPeerConnection(RTC_CFG);
  stream.getTracks().forEach(t=>pc.addTrack(t,stream));
  pc.ontrack = e => { $('remote').srcObject = e.streams[0]; };
  pc.onconnectionstatechange = ()=>{
    log('连接状态：'+pc.connectionState);
    if(pc.connectionState==='connected'){ setStatus('通话中'); ring(false); ui('incall'); }
    if(['failed','disconnected','closed'].includes(pc.connectionState)) endCall(false);
  };
  return pc;
}
function closePC(){ if(pc){ try{pc.close()}catch{} pc=null; } $('remote').srcObject=null; }

// 等待 ICE 收集完成，这样 SDP 里就带全了局域网地址
function waitIce(p){
  return new Promise(res=>{
    if(p.iceGatheringState==='complete') return res();
    const f=()=>{ if(p.iceGatheringState==='complete'){ p.removeEventListener('icegatheringstatechange',f); res(); } };
    p.addEventListener('icegatheringstatechange',f);
    setTimeout(res,4000);
  });
}

// ---------- UI 状态 ----------
function ui(state){
  $('btnCall').disabled = !(online && state==='idle');
  $('btnAnswer').disabled = state!=='ringing';
  $('btnHangup').disabled = state==='idle';
  $('btnMute').disabled = state!=='incall';
}

// ---------- 上线（模式一：BroadcastChannel 信令） ----------
$('btnOnline').onclick = async ()=>{
  const ext=$('ext').value.trim();
  if(!ext) return alert('请先填写分机号');
  await getMic().catch(()=>{});
  if(bc) bc.close();
  bc = new BroadcastChannel('lan-phone-v1');
  bc.onmessage = e=>onSignal(e.data);
  online=true; $('ext').disabled=true;
  $('btnOnline').disabled=true; $('btnOnline').textContent='已上线：'+ext;
  setStatus('空闲（分机 '+ext+'）'); ui('idle'); log('上线成功，分机 '+ext);
};

const me = ()=>$('ext').value.trim();
const send = m => bc && bc.postMessage(m);

// ---------- 主叫 ----------
$('btnCall').onclick = async ()=>{
  const to=$('dial').value.trim();
  if(!to) return;
  if(to===me()) return alert('不能呼叫自己');
  peerExt=to; callId=Math.random().toString(36).slice(2);
  await newPC();
  const offer=await pc.createOffer(); await pc.setLocalDescription(offer); await waitIce(pc);
  send({type:'offer',id:callId,from:me(),name:$('name').value,to,sdp:pc.localDescription.sdp});
  setStatus('正在呼叫 '+to+' …'); ui('calling'); ring(true); log('呼叫 '+to);
  setTimeout(()=>{ if(pc && pc.connectionState!=='connected' && callId) {log('无人应答');endCall(true);} },40000);
};

// ---------- 信令处理 ----------
async function onSignal(m){
  if(m.type==='offer' && m.to===me()){
    if(callId){ send({type:'busy',id:m.id,to:m.from,from:me()}); return; }
    callId=m.id; peerExt=m.from; pendingOffer=m.sdp;
    setStatus('来电：'+(m.name?m.name+' ':'')+m.from); ring(true); ui('ringing'); log('来电 '+m.from);
  }
  else if(m.type==='answer' && m.to===me() && m.id===callId){
    await pc.setRemoteDescription({type:'answer',sdp:m.sdp}); log('对方已接听，建立连接中…');
  }
  else if(m.type==='busy' && m.to===me() && m.id===callId){ log('对方忙线'); setStatus('对方忙线'); endCall(false); }
  else if(m.type==='hangup' && m.id===callId && (m.to===me())){ log('对方挂断'); endCall(false); }
}

// ---------- 接听 ----------
$('btnAnswer').onclick = async ()=>{
  ring(false);
  if(pendingOffer){            // 模式一
    await newPC();
    await pc.setRemoteDescription({type:'offer',sdp:pendingOffer});
    const ans=await pc.createAnswer(); await pc.setLocalDescription(ans); await waitIce(pc);
    send({type:'answer',id:callId,from:me(),to:peerExt,sdp:pc.localDescription.sdp});
    pendingOffer=null; setStatus('连接中…'); log('已接听');
  }
};

// ---------- 挂断 / 静音 ----------
function endCall(notify){
  if(notify && callId && peerExt) send({type:'hangup',id:callId,from:me(),to:peerExt});
  ring(false); closePC(); callId=null; peerExt=null; pendingOffer=null; muted=false;
  $('btnMute').textContent='静音';
  setStatus(online?'空闲（分机 '+me()+'）':'空闲'); ui('idle');
}
$('btnHangup').onclick = ()=>endCall(true);
$('btnMute').onclick = ()=>{
  muted=!muted; localStream.getAudioTracks().forEach(t=>t.enabled=!muted);
  $('btnMute').textContent = muted?'取消静音':'静音';
};
window.addEventListener('beforeunload',()=>{ if(callId) endCall(true); });

// ---------- 模式二：跨设备手动交换呼叫码 ----------
const enc = d => btoa(unescape(encodeURIComponent(JSON.stringify(d))));
const dec = s => JSON.parse(decodeURIComponent(escape(atob(s.trim()))));

$('btnGenOffer').onclick = async ()=>{
  await newPC();
  const o=await pc.createOffer(); await pc.setLocalDescription(o); await waitIce(pc);
  $('offerOut').value = enc(pc.localDescription); setStatus('等待对方应答码…'); ui('calling'); log('呼叫码已生成');
};
$('btnApplyAnswer').onclick = async ()=>{
  try{ await pc.setRemoteDescription(dec($('answerIn').value)); log('正在连接…'); }
  catch(e){ alert('应答码无效：'+e.message); }
};
$('btnGenAnswer').onclick = async ()=>{
  try{
    const offer=dec($('offerIn').value);
    await newPC();
    await pc.setRemoteDescription(offer);
    const a=await pc.createAnswer(); await pc.setLocalDescription(a); await waitIce(pc);
    $('answerOut').value = enc(pc.localDescription); setStatus('请把应答码发回主叫方'); ui('calling'); log('应答码已生成');
  }catch(e){ alert('呼叫码无效：'+e.message); }
};

// ---------- 标签切换 ----------
$('tabA').onclick=()=>{ $('modeA').style.display=''; $('modeB').style.display='none'; $('tabA').className='on'; $('tabB').className=''; };
$('tabB').onclick=()=>{ $('modeB').style.display=''; $('modeA').style.display='none'; $('tabB').className='on'; $('tabA').className=''; };
ui('idle');
</script>
</body>
</html>
